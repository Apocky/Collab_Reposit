[package]
name = "palimpsest_data"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
# Doc 02 §3.2 and §3.3: the core of this crate is `no_std` + `alloc`; the
# `loader` feature brings in std and serde_json for the JSON content checks
# (canon §1.6, doc 02 §11.1). It is off by default so that layer-2 crates
# (gen, ai), whose closure must not contain serde_json, can depend on the core.
loader = ["dep:serde_json"]
# Doc 02 §3.2 and §3.3: the `schema` module (JSON Schema export) is gated by
# this feature, and `schemars` is allowed only through it. Doc 21 WP-005 adds
# `dep:schemars`; until then the feature enables only the placeholder module.
schema = []

[dependencies]
palimpsest_math = { workspace = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
# The unit tests always compile the `content_check` module (cfg(test)), so
# they need serde_json even when the `loader` feature is off.
serde_json = { workspace = true }
proptest = { workspace = true }
