[workspace]
resolver = "3"
members = ["crates/palimpsest_math", "crates/palimpsest_data", "crates/palimpsest_sim"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
palimpsest_math = { path = "crates/palimpsest_math" }
palimpsest_data = { path = "crates/palimpsest_data" }
palimpsest_sim = { path = "crates/palimpsest_sim" }
blake3 = { version = "=1.8.7", default-features = false }
serde = { version = "=1.0.229", default-features = false, features = ["derive", "alloc"] }
serde_json = "=1.0.154"
postcard = { version = "=1.1.3", default-features = false, features = ["alloc"] }
proptest = "=1.12.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
float_arithmetic = "deny"
float_cmp = "deny"

# Canon §1.3: overflow panics in every profile.
[profile.dev]
overflow-checks = true

[profile.release]
overflow-checks = true

[profile.test]
overflow-checks = true
